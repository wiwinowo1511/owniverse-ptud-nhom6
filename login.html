<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập | OWNIVERSE</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth/login.css">
</head>
<body>

<section class="auth-page">

    <div class="auth-card">

        <h1>Đăng nhập</h1>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input
                    id="email"
                    type="email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input
                    id="password"
                    type="password"
                    required
                >
            </div>

            <button type="submit">
                Đăng nhập
            </button>

        </form>

        <div class="auth-links">

            <a href="forgot-password.html">
                Quên mật khẩu?
            </a>

            <a href="register.html">
                Tạo tài khoản
            </a>

        </div>

    </div>

</section>

<script src="./js/auth/auth.js"></script>
<script src="./js/auth/login.js"></script>

</body>
</html>
