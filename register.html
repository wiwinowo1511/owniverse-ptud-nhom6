<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Đăng ký | OWNIVERSE</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth/register.css">
</head>
<body>

<section class="auth-page">

    <div class="auth-card">

        <h1>Tạo tài khoản</h1>

        <form id="registerForm">

            <div class="form-group">
                <label>Họ tên</label>
                <input
                    id="name"
                    type="text"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    id="email"
                    type="email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input
                    id="phone"
                    type="tel"
                    required
                >
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input
                    id="password"
                    type="password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input
                    id="confirmPassword"
                    type="password"
                    required
                >
            </div>

            <button type="submit">
                Đăng ký
            </button>

        </form>

        <div class="auth-links">

            <a href="login.html">
                Đã có tài khoản?
            </a>

        </div>

    </div>

</section>

<script src="./js/auth/auth.js"></script>
<script src="./js/auth/register.js"></script>

</body>
</html>
