<link rel="stylesheet" href="css/chuanHeader.css">
<link rel="stylesheet" href="css/pages/notifications.css">
<header class="site-header">
    <div class="container header-inner">
      
      <!-- Logo chính (ngang) chuẩn Brand Identity -->
      <a href="index.html" class="brand-logo" aria-label="Trang chủ Owniverse">
        <svg class="logo-mark" viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Vòng quỹ đạo nghiêng màu tím #A78BFA -->
          <ellipse cx="32" cy="24" rx="26" ry="9" transform="rotate(-22 32 24)" stroke="#A78BFA" stroke-width="3"/>
          <!-- Ngôi sao 4 cánh nghiêng màu đen chủ đạo #0B0B0F -->
          <path d="M32 4C33.8 16.5 37.5 20.2 50 22C37.5 23.8 33.8 27.5 32 40C30.2 27.5 26.5 23.8 14 22C26.5 20.2 30.2 16.5 32 4Z" fill="#0B0B0F"/>
        </svg>
        <div class="logo-text-group">
          <span class="logo-wordmark">
            OWNI
            <!-- Chữ V cách điệu tam giác tím chuẩn Brand Identity -->
            <svg class="logo-v-svg" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M2 3H18L10 18L2 3Z" stroke="#A78BFA" stroke-width="3" stroke-linejoin="round"/>
            </svg>
            ERSE
          </span>
          <span class="logo-subtext">ARTISTS × FANS × FOREVER</span>
        </div>
      </a>

      <!-- Menu chính -->
      <nav class="main-nav" aria-label="Điều hướng chính">
        <ul>
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="about.html">Về chúng tôi</a></li>
          <li><a href="products.html">Sản phẩm</a></li>
          <li><a href="artist.html" >Nghệ sĩ</a></li>
          <li><a href="community.html">Cộng đồng</a></li>
        </ul>
      </nav>

      <!-- Cụm tiện ích kèm Icon nét mảnh chuẩn mục Icon & Elements -->
      <div class="header-actions">
        <a href="#artist-search" class="action-link">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          Tìm kiếm
        </a>
        <div class="notification-menu">
          <button class="notification-trigger" type="button" aria-label="Thông báo"
                  aria-expanded="false" aria-controls="notification-dropdown">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
              <path d="M10 21h4"></path>
            </svg>
            <span class="notification-indicator" hidden></span>
          </button>
          <section class="notification-dropdown" id="notification-dropdown"
                   aria-label="Thông báo gần đây" hidden>
            <div class="notification-dropdown_heading"><h2>Thông báo</h2></div>
            <ul class="notification-list" data-recent-notifications></ul>
            <a class="notification-view-all" href="noti.html">Xem tất cả</a>
          </section>
        </div>
        <a href="cart.html" class="action-link">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </a>
        <a href="account.html" class="account-circle" aria-label="Tài khoản">
          Tài<br>khoản
        </a>
      </div>

    </div>
  </header>
