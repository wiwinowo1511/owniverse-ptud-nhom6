<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Quên mật khẩu | OWNIVERSE</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth/forgot-password.css">
</head>
<body>

<section class="auth-page">

    <div class="auth-card">

        <h1>Khôi phục mật khẩu</h1>

        <p class="form-description">
            Nhập email để nhận hướng dẫn đặt lại mật khẩu.
        </p>

        <form id="forgotForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    id="email"
                    type="email"
                    required
                >

            </div>

            <button type="submit">
                Gửi yêu cầu
            </button>

        </form>

        <div class="auth-links">

            <a href="login.html">
                Quay lại đăng nhập
            </a>

        </div>

    </div>

</section>

<script src="./js/auth/auth.js"></script>
<script src="./js/auth/forgot-password.js"></script>

</body>
</html>
